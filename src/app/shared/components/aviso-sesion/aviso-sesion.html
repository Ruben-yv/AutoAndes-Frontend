@if (auth.porVencer() && !auth.avisoOculto()) {<section class="session-warning" role="status"><span>Tu sesión vence en <b>{{ cuentaRegresiva() }}</b>.</span><button class="btn" (click)="auth.cerrarSesion()">Cerrar sesión</button><button class="dismiss" aria-label="Ocultar aviso" (click)="auth.ocultarAviso()">×</button></section>}
